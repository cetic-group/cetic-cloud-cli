name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verifier-origine:
    # Un tag ne publie que s'il pointe sur un commit de `main` : un tag posé
    # sur une branche jamais relue ne doit produire aucune release.
    name: Tag sur un commit de main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Le commit taggé appartient à main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) n'est pas sur main — release refusée."
            exit 1
          fi

  build:
    name: Build ${{ matrix.os.name }}
    needs: [verifier-origine]
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: linux-amd64,    runs-on: ubuntu-latest, ext: '',    target: cetic }
          - { name: linux-arm64,    runs-on: ubuntu-24.04-arm, ext: '', target: cetic }
          - { name: darwin-arm64,   runs-on: macos-latest, ext: '',     target: cetic }
          - { name: windows-amd64,  runs-on: windows-latest, ext: .exe, target: cetic }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # La version de la CLI est TOUJOURS dérivée du tag de release (v1.4.0 -> 1.4.0)
      # et écrite dans les sources avant le build. Le tag est donc la source unique
      # de vérité : `cetic --version` == tag, impossible de diverger.
      # Python (pas sed) pour rester portable sur les runners linux/macOS/windows.
      - name: Stamp version from tag
        shell: bash
        env:
          REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          v = os.environ["REF"].removeprefix("v")
          targets = {
              "cetic/__init__.py": (r'(?m)^__version__ = .*', f'__version__ = "{v}"'),
              "pyproject.toml":    (r'(?m)^version = ".*"',   f'version = "{v}"'),
          }
          for f, (pat, repl) in targets.items():
              p = pathlib.Path(f)
              p.write_text(re.sub(pat, lambda _m: repl, p.read_text()))
              print(f"{f} -> {v}")
          PY

      - name: Build PyInstaller binary
        run: pyinstaller --clean --noconfirm cetic.spec

      - name: Rename binary
        shell: bash
        run: mv "dist/${{ matrix.os.target }}${{ matrix.os.ext }}" "dist/cetic-${{ matrix.os.name }}${{ matrix.os.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cetic-${{ matrix.os.name }}
          path: dist/cetic-${{ matrix.os.name }}*
          if-no-files-found: error
          # ⚠️ **1 jour, le minimum** : ces binaires ne servent QU'À l'intérieur
          # de ce run — le job `release` les retélécharge (`download-artifact`,
          # `merge-multiple: true`) et les publie en **assets de Release**, qui
          # sont le stockage durable et ne comptent PAS dans ce quota. Passé le
          # run, l'artefact est un doublon de l'asset.
          #
          # Sans cette ligne le défaut GitHub est de 90 jours, et les doublons
          # épuisent le quota de stockage d'artefacts.
          retention-days: 1

  # macOS Intel (darwin-amd64) : PAS de binaire pré-compilé. La dépendance
  # `cryptography` (≥ 49) ne publie plus de wheel macOS x86_64 (Intel Mac EOL
  # upstream) et GitHub a retiré les runners Intel macOS → le cross-build n'est
  # pas réalisable de façon fiable. Les (rares) utilisateurs Intel Mac installent
  # via `pip install git+https://github.com/cetic-group/cetic-cloud-cli` (compile
  # cryptography from-source). Binaires pré-compilés : darwin-arm64 (Apple
  # Silicon) + linux amd64/arm64 + windows amd64.

  release:
    name: Publish Release
    needs: [build]
    runs-on: ubuntu-latest
    # Publication soumise à l'approbation d'un membre de `release-managers`.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum cetic-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/cetic-*
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
